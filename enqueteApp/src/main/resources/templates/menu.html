<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
<meta charset="UTF-8">
<!-- ユーザーメニュー -->
<title>メニュー</title>
<link rel="stylesheet" type="text/css" th:href="@{/css/common.css}">
</head>
<body>
	<h2 class="heading">メニュー画面</h2>
	<div th:replace="'common/user_logout' :: user_logout"></div>
	<hr>
	<!-- ユーザー管理とアンケート管理はログイン中のユーザーの権限が管理者の時のみ表示 -->
	<p class="menu"><a sec:authorize="hasAuthority('ADMIN')" th:href="@{/user}">
		ユーザー管理
	</a></p>
	<p class="menu"><a sec:authorize="hasAuthority('ADMIN')" th:href="@{/management}">
		アンケート管理
	</a></p>
	<p class="menu"><a th:href="@{/enquete}">
 		アンケート回答一覧
 	</a></p>
	<p class="menu"><a th:href="@{/total}">
		アンケート結果閲覧
	</a></p>
</body>
</html>
