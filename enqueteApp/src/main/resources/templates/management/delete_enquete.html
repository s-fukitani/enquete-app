<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<!-- アンケート削除（一覧）ページ -->
<title>アンケート削除</title>
<link rel="stylesheet" type="text/css" th:href="@{/css/common.css}">
<link rel="stylesheet" type="text/css" th:href="@{/css/enquete.css}">
</head>
<body>
	<h2 class="heading">アンケート削除画面（一覧）</h2>
	<div th:replace="'common/user_logout' :: user_logout"></div>
	<hr>
	<!-- 削除が完了して戻ってきたときに表示 -->
	<p class="complete-message" th:if="${message}" th:text="${message}">
		完了メッセージ
	</p>
	<div th:if="${enquetes.size() > 0}">
		<table class="enquete-list-table">
			<tr class="table-header">
				<th>
					アンケートタイトル
				</th>
				<th>
					操作
				</th>
			</tr>
			<tr th:each="enquete : ${enquetes}">
				<td>
					[[${enquete.enqueteTitle}]]
				</td>
				<td class="td-button">
					<form th:action="@{/management/delete}" method="post">
						<input type="hidden" th:value="${enquete.id}" th:name="enqueteId">
						<input type="submit" value="削除">
					</form>
				</td>
			</tr>
		</table>
	</div>
	<div th:if="${enquetes.size() == 0}">
		<span class="no-enquete-message" >アンケートがありません。</span>
	</div>	
	<hr>
	<a th:href="@{/management}">アンケート管理メニューへ戻る</a>
</body>
</html>
